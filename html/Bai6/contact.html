<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
</head>
<body>
    
<h2>Contact Us</h2>

    <form style="width: 550px;">
        <fieldset>
            <legend>Your message:</legend>
            <table cellpadding="4">
                <tr>
                    <td align="right">To</td>
                    <td><input type="text" name="to" value="Example Cafe" size="30"></td>
                </tr>
                <tr>
                    <td align="right">Your email</td>
                    <td><input type="email" name="email" size="30"></td>
                </tr>
                <tr>
                    <td align="right" valign="top">Message</td>
                    <td><textarea name="message" rows="8" cols="45"></textarea></td>
                </tr>
                <tr>
                    <td align="right">Attach File</td>
                    <td><input type="file" name="file"></td>
                </tr>
            </table>
        </fieldset>

        <br>

        <fieldset>
            <legend>How you found us:</legend>
            <table cellpadding="4">
                <tr>
                    <td>How did you hear of us</td>
                    <td>
                        <select name="hear">
                            <option>Google</option>
                            <option>Friends</option>
                            <option>Youtube</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Newsletter</td>
                    <td>
                        <input type="checkbox" name="newsletter" checked>
                        Ensure this box is checked if you would like to receive email updates
                    </td>
                </tr>
            </table>
        </fieldset>

        <br>
        <input type="submit" value="Send message">
    </form>

</body>
</html>
