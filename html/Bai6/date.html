<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<form style="width: 250px; border: 2px solid #87CEFA; padding: 15px;">
        <p>
            Name:<br>
            <input type="text" name="fullname" style="width: 100%;">
        </p>

        <p>
            Telephone Number:<br>
            <input type="tel" name="phone" style="width: 100%;">
        </p>

        <p>
            Email:<br>
            <input type="email" name="email" style="width: 100%;">
        </p>

        <p>
            Favorite Color:<br>
            <input type="color" name="color" value="#0000FF" style="width: 60px; height: 25px;">
        </p>

        <p>
            Date of Birth:<br>
            <input type="date" name="dob" value="2015-07-16" style="width: 100%;">
        </p>

        <p align="center">
            <br>
            <input type="submit" value="Submit">
        </p>
    </form>

</body>
</html>
